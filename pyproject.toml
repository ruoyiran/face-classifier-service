[project]
name = "face-classifier-service"
version = "0.1.0"
description = "Private local FastAPI service for face detection, alignment, quality, and embeddings."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pillow>=11.1,<12.0",
  "pillow-heif>=1.0,<2.0",
  "numpy>=1.26,<2.0",
  "pynacl>=1.5,<2.0",
  "cryptography>=42,<50",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<1.0",
]
models = [
  "onnxruntime-gpu==1.20.1",
  "onnx>=1.16,<2.0",
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
  "numpy>=1.26,<2.0",
  "sympy==1.13.1",
  "safetensors>=0.4,<1.0",
  "transformers>=4.40,<5.0",
  "omegaconf>=2.3,<3.0",
  "timm>=0.9,<2.0",
  "easydict>=1.13,<2.0",
  "opencv-python-headless>=4.9,<5.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
